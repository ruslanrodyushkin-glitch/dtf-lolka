name: DTF -> Lolka

on:
  schedule:
    - cron: "*/10 * * * *"   # каждые 10 минут
  workflow_dispatch:          # кнопка ручного запуска

permissions:
  contents: write             # чтобы сохранять dtf_seen.json в репозиторий

concurrency:
  group: dtf-lolka
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Отправить новости
        env:
          LOLKA_WEBHOOK_URL: ${{ secrets.LOLKA_WEBHOOK_URL }}
        run: python dtf_to_lolka.py

      - name: Сохранить список отправленных
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add dtf_seen.json
          git diff --cached --quiet || (git commit -m "update seen" && git push)
